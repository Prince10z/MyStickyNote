name: Deploy Landing Page to Ubuntu Server

on:
  push:
    branches:
      - main # Trigger deployment on push to main branch
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'landing-page/package-lock.json'

      - name: Sync Desktop Renderer to Landing Page App Route
        run: |
          echo "Syncing desktop renderer frontend to landing page public directory..."
          mkdir -p landing-page/public/app
          # Delete old contents to ensure an exact sync
          rm -rf landing-page/public/app/*
          # Copy latest files from the desktop app's renderer directory
          cp -r renderer/* landing-page/public/app/

      - name: Install Dependencies
        run: |
          cd landing-page
          npm ci

      - name: Build Next.js Landing Page
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
        run: |
          cd landing-page
          npm run build

      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Prepare Deployment Directory
        run: |
          echo "Creating target directory on remote server if it doesn't exist..."
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /var/www/mystickynote/landing-page"

      - name: Deploy built files via rsync
        run: |
          echo "Deploying landing page files..."
          # Deploy Next.js build, public files, configuration and packages
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || 22 }}" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --delete \
            landing-page/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/mystickynote/landing-page/

      - name: Install server-side dependencies and restart PM2
        run: |
          echo "Installing production node_modules and reloading PM2 on Ubuntu server..."
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /var/www/mystickynote/landing-page &&
            npm install --production &&
            pm2 startOrReload ecosystem.config.js --env production
          "
